[package]
name = "client"
version = "0.1.0"
authors = ["Charles Bournhonesque <charlesbour@gmail.com>"]
edition = "2021"
rust-version = "1.89"
description = "Client for the lightrider game"
readme = "README.md"
repository = "https://github.com/cBournhonesque/lightrider"
keywords = ["bevy", "multiplayer", "networking", "netcode", "gamedev"]
categories = ["game-development", "network-programming"]
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "lightrider-client"
path = "src/bin/main.rs"

[features]
default = []
bevygap = ["dep:bevygap_client_plugin"]
bevygap-matchmaker-tls = ["bevygap", "bevygap_client_plugin/matchmaker-tls"]

[dependencies]
shared = { path = "../shared" }
lightyear.workspace = true
bevy_enhanced_input.workspace = true
serde.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
bevy.workspace = true
clap.workspace = true
bevy-inspector-egui.workspace = true
parry2d = "0.13"
derive_more = { version = "0.99", features = ["add", "mul"] }
cfg-if = "1.0.0"
bevygap_client_plugin = { path = "../../bevygap/bevygap_client_plugin", optional = true }

[target."cfg(not(target_family = \"wasm\"))".dependencies]
tokio = { version = "1.34", features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "net",
    "time",
] }

[target."cfg(target_family = \"wasm\")".dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
tokio = { version = "1.34", features = ["macros", "rt"] }
web-sys = { version = "0.3", features = ["Document", "Element", "Location", "UrlSearchParams", "Window"] }
bevy_web_keepalive = { git = "https://github.com/Nul-led/bevy_web_keepalive.git", rev = "ac1e853d378c1b6f4df22fdbbf29bb954146f4de" }
