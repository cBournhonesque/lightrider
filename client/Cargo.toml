[package]
name = "client"
version = "0.1.0"
authors = ["Charles Bournhonesque <charlesbour@gmail.com>"]
edition = "2021"
rust-version = "1.89"
description = "Client for the lightrider game"
readme = "README.md"
repository = "https://github.com/cBournhonesque/lightrider"
keywords = ["bevy", "multiplayer", "networking", "netcode", "gamedev"]
categories = ["game-development", "network-programming"]
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "lightrider-client"
path = "src/bin/main.rs"

[features]
default = []
lightyear-matchmaker = [
    "dep:base64",
    "dep:lightyear_matchmaker_bevy_client",
    "dep:lightyear_matchmaker_core",
]
bevygap = ["lightyear-matchmaker"]
bevygap-matchmaker-tls = ["bevygap"]

[dependencies]
shared = { path = "../shared" }
lightyear.workspace = true
lightyear_tools = { path = "../../lightyear/crates/tools/tools" }
bevy_enhanced_input.workspace = true
serde.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
bevy = { workspace = true, features = [
    "2d_bevy_render",
    "3d_bevy_render",
    "bevy_core_pipeline",
    "picking",
    "ui_api",
    "ui_bevy_render",
] }
bevy_seedling.workspace = true
clap.workspace = true
parry2d = "0.13"
derive_more = { version = "0.99", features = ["add", "mul"] }
cfg-if = "1.0.0"
base64 = { version = "0.22", optional = true }
lightyear_matchmaker_bevy_client = { path = "../../lightyear-matchmaker/crates/lightyear_matchmaker_bevy_client", optional = true }
lightyear_matchmaker_core = { path = "../../lightyear-matchmaker/crates/lightyear_matchmaker_core", optional = true }

[target."cfg(not(target_family = \"wasm\"))".dependencies]
tokio = { version = "1.34", features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "net",
    "time",
] }

[target."cfg(target_family = \"wasm\")".dependencies]
bevy_seedling = { workspace = true, features = ["web_audio"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
tokio = { version = "1.34", features = ["macros", "rt"] }
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Element", "Location", "UrlSearchParams", "Window"] }
