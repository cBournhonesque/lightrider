[workspace]
resolver = "2"
members = [
  "client",
  "server",
  "shared",
  "web_client",
]

[workspace.dependencies]
lightyear = { path = "../lightyear/lightyear", features = [
  "input_bei",
  "frame_interpolation",
  "netcode",
  "webtransport",
  "webtransport_self_signed",
  "webtransport_dangerous_configuration",
  "debug",
  "compression_lz4",
] }
bevy_replicon = { path = "../bevy_replicon" }
bevy_enhanced_input = { version = "0.24.4", features = ["serialize"] }
serde = { version = "1.0.188", features = ["derive"] }
serde_json = "1.0"
ron = "0.8"
anyhow = { version = "1.0.75", features = [] }
tracing = "0.1"
tracing-subscriber = "0.3.17"
bevy = { version = "0.18", default-features = false, features = [
  "2d_bevy_render",
  "3d_bevy_render",
  "bevy_core_pipeline",
  "default_app",
  "default_platform",
  "picking",
  "scene",
  "ui_api",
  "ui_bevy_render",
] }
bevy_seedling = { version = "0.7.2", default-features = false, features = [
  "ogg",
  "reflect",
  "wav",
] }
derive_more = { version = "0.99", features = ["add", "mul"] }
clap = { version = "4.4", features = ["derive"] }
bevy_turborand = "0.13"
bevy-inspector-egui = "0.36"

# Enable a small amount of optimization in debug mode
[profile.dev]
opt-level = 1
incremental = true
debug = "line-tables-only"

# Enable high optimizations for dependencies (incl. Bevy), but not for our code.
# Dependency debuginfo is expensive for Bevy/Lightyear and usually not worth the disk.
[profile.dev.package."*"]
opt-level = 3
debug = 0

# Build scripts and proc macros do not need debuginfo for normal iteration.
[profile.dev.build-override]
debug = 0
