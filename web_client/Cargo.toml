[package]
name = "web_client"
version = "0.1.0"
authors = ["Charles Bournhonesque <charlesbour@gmail.com>"]
edition = "2021"
rust-version = "1.89"
description = "Browser shell for the lightrider game"
repository = "https://github.com/cBournhonesque/lightrider"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "lightrider-web"
path = "src/main.rs"

[dependencies]
client = { path = "../client", default-features = false, features = ["client"] }
shared = { path = "../shared", default-features = false, features = ["client"] }
bevy.workspace = true
leptos = { version = "0.8", features = ["csr"] }
leptos-bevy-canvas = "0.6.0"
lightyear_matchmaker_core = { path = "../../lightyear-matchmaker/crates/lightyear_matchmaker_core", optional = true }

[features]
default = []
lightyear-matchmaker = ["client/lightyear-matchmaker", "dep:lightyear_matchmaker_core"]
bevygap = ["lightyear-matchmaker"]
bevygap-matchmaker-tls = ["bevygap", "client/bevygap-matchmaker-tls"]

[target."cfg(target_family = \"wasm\")".dependencies]
console_error_panic_hook = "0.1"
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "History",
    "HtmlElement",
    "KeyboardEvent",
    "Location",
    "UrlSearchParams",
    "Window",
] }
