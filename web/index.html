<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lightrider</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #05070b;
        color: #e7fbff;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        overflow: hidden;
      }

      body {
        min-width: 320px;
      }

      button,
      input {
        font: inherit;
      }

      .lightrider-web-shell,
      .game-stage {
        height: 100vh;
        width: 100vw;
      }

      .lightrider-web-shell {
        position: relative;
        isolation: isolate;
      }

      .game-stage {
        position: absolute;
        inset: 0;
        z-index: 0;
      }

      canvas {
        display: block;
        height: 100vh !important;
        width: 100vw !important;
      }

      .menu-backdrop {
        align-items: center;
        background:
          radial-gradient(circle at 50% 25%, rgb(18 80 76 / 40%), transparent 34rem),
          rgb(1 6 10 / 52%);
        display: flex;
        inset: 0;
        justify-content: center;
        padding: 24px;
        position: absolute;
        z-index: 2;
      }

      .hidden {
        display: none !important;
      }

      .join-modal {
        background: rgb(2 10 16 / 84%);
        border: 1px solid rgb(102 255 232 / 38%);
        border-radius: 8px;
        box-shadow: 0 24px 90px rgb(0 0 0 / 56%);
        max-width: 420px;
        padding: 26px;
        width: min(420px, calc(100vw - 48px));
      }

      .join-modal h1 {
        color: #70ffee;
        font-size: clamp(34px, 9vw, 64px);
        font-weight: 800;
        letter-spacing: 0;
        line-height: 0.9;
        margin: 0 0 22px;
        text-shadow: 0 0 18px rgb(112 255 238 / 42%);
      }

      .join-modal form {
        display: grid;
        gap: 12px;
      }

      .name-input,
      .room-input {
        background: rgb(255 255 255 / 8%);
        border: 1px solid rgb(212 255 247 / 28%);
        border-radius: 6px;
        box-sizing: border-box;
        color: #f4ffff;
        height: 46px;
        outline: none;
        padding: 0 13px;
        width: 100%;
      }

      .name-input:focus,
      .room-input:focus {
        border-color: #70ffee;
        box-shadow: 0 0 0 3px rgb(112 255 238 / 18%);
      }

      .room-row {
        display: grid;
        gap: 10px;
        grid-template-columns: minmax(92px, 120px) 1fr;
      }

      .room-input {
        text-transform: uppercase;
      }

      .play-button,
      .modal-links button,
      .menu-button {
        border: 0;
        cursor: pointer;
      }

      .play-button {
        background: #70ffee;
        border-radius: 6px;
        color: #031014;
        font-weight: 800;
        height: 46px;
      }

      .form-error {
        color: #ff8f8f;
        font-size: 13px;
        margin: 0;
        min-height: 18px;
      }

      .modal-links {
        align-items: center;
        display: flex;
        gap: 14px;
        justify-content: space-between;
        margin-top: 16px;
      }

      .modal-links button,
      .modal-links a,
      .menu-button {
        color: #bdfbf5;
        font-size: 12px;
        font-weight: 700;
        text-decoration: none;
      }

      .modal-links button {
        background: transparent;
        padding: 0;
      }

      .menu-button {
        background: rgb(2 10 16 / 72%);
        border: 1px solid rgb(102 255 232 / 28%);
        border-radius: 6px;
        height: 34px;
        padding: 0 12px;
        position: absolute;
        right: 14px;
        top: 14px;
        z-index: 3;
      }

      @media (max-width: 440px) {
        .room-row {
          grid-template-columns: 1fr;
        }

        .join-modal {
          padding: 22px;
        }
      }
    </style>
  </head>
  <body>
    <script type="module">
      import init from "./pkg/lightrider-web.js";

      init();
    </script>
  </body>
</html>
